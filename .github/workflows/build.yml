name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-katago:
    name: Build KataGo for Android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lightvector/KataGo
          ref: v1.16.5
          path: katago-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip cmake build-essential \
            wget curl pkg-config libeigen3-dev

      - name: Install Android NDK
        run: |
          export ANDROID_NDK_VERSION=r25b
          export ANDROID_NDK_HOME=$HOME/android-ndk
          wget -q https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          unzip -q android-ndk-${ANDROID_NDK_VERSION}-linux.zip -d $HOME/
          mv $HOME/android-ndk-${ANDROID_NDK_VERSION} $ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Download Eigen3 headers
        run: |
          wget -q https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
          tar xzf eigen-3.4.0.tar.gz
          ls eigen-3.4.0/
          echo "EIGEN3_DIR=$PWD/eigen-3.4.0" >> $GITHUB_ENV

      - name: Build KataGo (arm64-v8a, CPU/Eigen)
        run: |
          cd katago-src/cpp
          export ANDROID_NDK_HOME=$HOME/android-ndk
          export TOOLCHAIN=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          mkdir -p build-android-arm64
          cd build-android-arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DUSE_BACKEND=EIGEN \
            -DNO_GIT_REVISION=1 \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DEigen3_DIR=$EIGEN3_DIR/cmake \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
          make -j$(nproc) katago 2>&1 | tail -100

      - name: Collect binaries
        run: |
          mkdir -p katago-output
          cp katago-src/cpp/build-android-arm64/katago katago-output/katago
          chmod +x katago-output/katago
          file katago-output/katago
          ls -lh katago-output/

      - name: Upload KataGo binary
        uses: actions/upload-artifact@v4
        with:
          name: katago-android-arm64
          path: katago-output/katago

  download-model:
    name: Download KataGo Model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download lightweight model (b10c128, ~12MB)
        run: |
          mkdir -p model-output
          curl -L -o model-output/model.bin.gz \
            "https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b10c128-s1141046784-d204142634.bin.gz"
          ls -lh model-output/
          echo "model_size=$(du -h model-output/model.bin.gz | cut -f1)"

      - name: Create default config
        run: |
          cat > model-output/default_gtp.cfg << 'EOF'
          numSearchThreads = 4
          maxVisits = 200
          maxTime = 5.0
          analysisPVLen = 12
          EOF
          ls -lh model-output/

      - name: Upload model and config
        uses: actions/upload-artifact@v4
        with:
          name: katago-model-config
          path: model-output/

  build-apk:
    name: Build Android APK
    needs: [build-katago, download-model]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download KataGo binary
        uses: actions/download-artifact@v4
        with:
          name: katago-android-arm64
          path: assets/katago/

      - name: Download model and config
        uses: actions/download-artifact@v4
        with:
          name: katago-model-config
          path: assets/katago/

      - name: Prepare assets
        run: |
          chmod +x assets/katago/katago
          ls -lh assets/katago/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential libsqlite3-dev \
            wget curl automake openjdk-17-jdk
          sudo apt-get install -y libtinfo5 2>/dev/null || true

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
        env:
          ANDROIDSDK: $HOME/.buildozer/android/platform/android-sdk
          ANDROIDNDK: $HOME/.buildozer/android/platform/android-ndk-r25b
          BUILDOZER_WARN_ON_ROOT: 1
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Find APK files
        id: find_apk
        run: |
          echo "APK files found:"
          ls -la bin/*.apk 2>/dev/null || echo "No APK found in bin/"
          find . -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(ls bin/*.apk 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          if [ -n "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
