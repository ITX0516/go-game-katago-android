name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-katago:
    name: Build KataGo for Android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lightvector/KataGo
          ref: v1.16.5
          path: katago-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip cmake build-essential \
            wget curl pkg-config

      - name: Install Android NDK
        run: |
          export ANDROID_NDK_VERSION=r25b
          export ANDROID_NDK_HOME=$HOME/android-ndk
          wget -q https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          unzip -q android-ndk-${ANDROID_NDK_VERSION}-linux.zip -d $HOME/
          mv $HOME/android-ndk-${ANDROID_NDK_VERSION} $ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV
          echo "SYSROOT=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> $GITHUB_ENV

      - name: Create output prefix
        run: |
          export PREFIX=$HOME/android-prefix
          mkdir -p $PREFIX/lib $PREFIX/include
          echo "PREFIX=$PREFIX" >> $GITHUB_ENV

      - name: Build zlib (from GitHub mirror)
        run: |
          cd $HOME
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git zlib
          cd zlib
          export ANDROID_NDK_HOME=$HOME/android-ndk
          export TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          make install
          echo "--- zlib installed ---"
          ls -la $PREFIX/lib/
          ls -la $PREFIX/include/

      - name: Build libzip (from GitHub)
        run: |
          cd $HOME
          git clone --depth 1 --branch v1.10.1 https://github.com/nih-at/libzip.git libzip
          cd libzip
          export ANDROID_NDK_HOME=$HOME/android-ndk
          export TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_BZIP2=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOC=OFF \
            -DBUILD_TOOLS=OFF \
            -DZLIB_INCLUDE_DIR=$PREFIX/include \
            -DZLIB_LIBRARY=$PREFIX/lib/libz.a
          make -j$(nproc)
          make install
          echo "--- libzip installed ---"
          ls -la $PREFIX/lib/
          ls -la $PREFIX/include/

      - name: Build and install Eigen3
        run: |
          cd $HOME
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git eigen-3.4.0
          cd eigen-3.4.0
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_BUILD_TYPE=Release
          make install
          echo "--- Eigen3 installed ---"
          ls $PREFIX/include/eigen3/Eigen/ | head -10
          ls $PREFIX/share/eigen3/cmake/ | head -10

      - name: Build KataGo (arm64-v8a, Eigen CPU)
        run: |
          cd $GITHUB_WORKSPACE/katago-src/cpp
          export ANDROID_NDK_HOME=$HOME/android-ndk
          export TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          mkdir -p build-android-arm64
          cd build-android-arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DUSE_BACKEND=EIGEN \
            -DNO_GIT_REVISION=1 \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX;$PREFIX/share/eigen3/cmake" \
            -DCMAKE_FIND_ROOT_PATH="$PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DZLIB_INCLUDE_DIR=$PREFIX/include \
            -DZLIB_LIBRARY=$PREFIX/lib/libz.a \
            -Dzip_INCLUDE_DIR=$PREFIX/include \
            -Dzip_LIBRARY=$PREFIX/lib/libzip.a
          make -j$(nproc) katago 2>&1 | tail -100

      - name: Verify KataGo binary
        run: |
          mkdir -p katago-output
          cp $GITHUB_WORKSPACE/katago-src/cpp/build-android-arm64/katago katago-output/katago
          chmod +x katago-output/katago
          file katago-output/katago
          ls -lh katago-output/

      - name: Upload KataGo binary
        uses: actions/upload-artifact@v4
        with:
          name: katago-android-arm64
          path: katago-output/katago

  download-model:
    name: Download KataGo Model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download lightweight model (b10c128, ~12MB)
        run: |
          mkdir -p model-output
          curl -L -o model-output/model.bin.gz \
            "https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b10c128-s1141046784-d204142634.bin.gz"
          ls -lh model-output/
          echo "model_size=$(du -h model-output/model.bin.gz | cut -f1)"

      - name: Create default config
        run: |
          cat > model-output/default_gtp.cfg << 'EOF'
          numSearchThreads = 4
          maxVisits = 200
          maxTime = 5.0
          analysisPVLen = 12
          EOF
          ls -lh model-output/

      - name: Upload model and config
        uses: actions/upload-artifact@v4
        with:
          name: katago-model-config
          path: model-output/

  build-apk:
    name: Build Android APK
    needs: [build-katago, download-model]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download KataGo binary
        uses: actions/download-artifact@v4
        with:
          name: katago-android-arm64
          path: assets/katago/

      - name: Download model and config
        uses: actions/download-artifact@v4
        with:
          name: katago-model-config
          path: assets/katago/

      - name: Prepare assets
        run: |
          chmod +x assets/katago/katago 2>/dev/null || true
          ls -lh assets/katago/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential libsqlite3-dev \
            wget curl automake openjdk-17-jdk
          sudo apt-get install -y libtinfo5 2>/dev/null || true

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
        env:
          ANDROIDSDK: $HOME/.buildozer/android/platform/android-sdk
          ANDROIDNDK: $HOME/.buildozer/android/platform/android-ndk-r25b
          BUILDOZER_WARN_ON_ROOT: 1
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Find APK files
        id: find_apk
        run: |
          echo "APK files found:"
          ls -la bin/*.apk 2>/dev/null || echo "No APK found in bin/"
          find . -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(ls bin/*.apk 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          if [ -n "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
