name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  extract-katago:
    name: Extract KataGo from BadukAI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Download BadukAI APK
        run: |
          wget -q -O badukai.apk \
            "https://github.com/aki65/aki65.github.io/releases/download/v1.23.0/baduk_ai__arm64-v8a-rel-1.23.apk"
          ls -lh badukai.apk

      - name: Extract KataGo binary from APK
        run: |
          mkdir -p katago-extract
          cd katago-extract
          unzip ../badukai.apk -d . 2>&1 | head -30
          echo "--- lib/arm64_v8a files:"
          ls -la lib/arm64_v8a/ 2>/dev/null || ls -la lib/ 2>/dev/null || echo "no lib dir"
          echo "--- assets files:"
          find assets -type f 2>/dev/null | head -30 || echo "no assets"
          echo "--- all .so files:"
          find . -name "*.so" -type f 2>/dev/null | head -20
          echo "--- searching for katago:"
          find . -iname "*katago*" -type f 2>/dev/null | head -20
          find . -iname "*kata*" -type f 2>/dev/null | head -20

      - name: Find and extract KataGo
        run: |
          mkdir -p katago-output
          # Try to find katago binary or library
          if [ -f katago-extract/lib/arm64_v8a/libkatago.so ]; then
            cp katago-extract/lib/arm64_v8a/libkatago.so katago-output/katago
            echo "Found libkatago.so"
          elif [ -f katago-extract/lib/arm64-v8a/libkatago.so ]; then
            cp katago-extract/lib/arm64-v8a/libkatago.so katago-output/katago
            echo "Found libkatago.so"
          else
            find katago-extract -name "*katago*" -o -name "*kata*" | head -20
            echo "Could not find katago, listing all executables..."
            find katago-extract -type f -executable | head -20
          fi
          ls -lh katago-output/

      - name: List APK structure
        run: |
          cd katago-extract
          echo "=== APK structure (top 50 files):"
          find . -type f | head -50
          echo ""
          echo "=== assets dir:"
          find assets -type f 2>/dev/null | head -30
          echo ""
          echo "=== lib dir:"
          find lib -type f 2>/dev/null | head -30

      - name: Upload extracted katago binary
        uses: actions/upload-artifact@v4
        with:
          name: katago-android-arm64
          path: katago-output/

  download-model:
    name: Download KataGo Model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download lightweight model (b10c128, ~12MB)
        run: |
          mkdir -p model-output
          curl -L -o model-output/model.bin.gz \
            "https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b10c128-s1141046784-d204142634.bin.gz"
          ls -lh model-output/
          echo "model_size=$(du -h model-output/model.bin.gz | cut -f1)"

      - name: Create default config
        run: |
          cat > model-output/default_gtp.cfg << 'EOF'
          numSearchThreads = 4
          maxVisits = 200
          maxTime = 5.0
          analysisPVLen = 12
          EOF
          ls -lh model-output/

      - name: Upload model and config
        uses: actions/upload-artifact@v4
        with:
          name: katago-model-config
          path: model-output/

  build-apk:
    name: Build Android APK
    needs: [extract-katago, download-model]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download KataGo binary
        uses: actions/download-artifact@v4
        with:
          name: katago-android-arm64
          path: assets/katago/

      - name: Download model and config
        uses: actions/download-artifact@v4
        with:
          name: katago-model-config
          path: assets/katago/

      - name: Prepare assets
        run: |
          chmod +x assets/katago/katago 2>/dev/null || true
          ls -lh assets/katago/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential libsqlite3-dev \
            wget curl automake openjdk-17-jdk
          sudo apt-get install -y libtinfo5 2>/dev/null || true

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
        env:
          ANDROIDSDK: $HOME/.buildozer/android/platform/android-sdk
          ANDROIDNDK: $HOME/.buildozer/android/platform/android-ndk-r25b
          BUILDOZER_WARN_ON_ROOT: 1
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Find APK files
        id: find_apk
        run: |
          echo "APK files found:"
          ls -la bin/*.apk 2>/dev/null || echo "No APK found in bin/"
          find . -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(ls bin/*.apk 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          if [ -n "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
