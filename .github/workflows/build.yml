name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-katago:
    name: Build KataGo for Android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lightvector/KataGo
          ref: v1.16.5
          path: katago-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip cmake build-essential \
            wget curl pkg-config

      - name: Install Android NDK
        run: |
          export ANDROID_NDK_VERSION=r25b
          export ANDROID_NDK_HOME=$HOME/android-ndk
          wget -q https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          unzip -q android-ndk-${ANDROID_NDK_VERSION}-linux.zip -d $HOME/
          mv $HOME/android-ndk-${ANDROID_NDK_VERSION} $ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV
          echo "SYSROOT=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> $GITHUB_ENV

      - name: Create output prefix
        run: |
          export PREFIX=$HOME/android-prefix
          mkdir -p $PREFIX/lib $PREFIX/include
          echo "PREFIX=$PREFIX" >> $GITHUB_ENV

      - name: Build zlib (from GitHub mirror)
        run: |
          cd $HOME
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git zlib
          cd zlib
          export ANDROID_NDK_HOME=$HOME/android-ndk
          export TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          make install
          echo "--- zlib installed ---"
          ls -la $PREFIX/lib/
          ls -la $PREFIX/include/

      - name: Build libzip (from GitHub)
        run: |
          cd $HOME
          git clone --depth 1 --branch v1.10.1 https://github.com/nih-at/libzip.git libzip
          cd libzip
          export ANDROID_NDK_HOME=$HOME/android-ndk
          export TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_BZIP2=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOC=OFF \
            -DBUILD_TOOLS=OFF \
            -DZLIB_INCLUDE_DIR=$PREFIX/include \
            -DZLIB_LIBRARY=$PREFIX/lib/libz.a
          make -j$(nproc)
          make install
          echo "--- libzip installed ---"
          ls -la $PREFIX/lib/
          ls -la $PREFIX/include/

      - name: Build and install Eigen3
        run: |
          cd $HOME
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git eigen-3.4.0
          cd eigen-3.4.0
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_BUILD_TYPE=Release
          make install
          echo "--- Eigen3 installed ---"
          ls $PREFIX/include/eigen3/Eigen/ | head -10
          ls $PREFIX/share/eigen3/cmake/ | head -10

      - name: Build KataGo (arm64-v8a, Eigen CPU)
        run: |
          cd $GITHUB_WORKSPACE/katago-src/cpp
          export ANDROID_NDK_HOME=$HOME/android-ndk
          export TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          mkdir -p build-android-arm64
          cd build-android-arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DUSE_BACKEND=EIGEN \
            -DNO_GIT_REVISION=1 \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wno-cast-align -Wno-error=cast-align -DBYTE_ORDER=1234 -DLITTLE_ENDIAN=1234 -DBIG_ENDIAN=4321" \
            -DCMAKE_C_FLAGS="-Wno-cast-align -Wno-error=cast-align -DBYTE_ORDER=1234 -DLITTLE_ENDIAN=1234 -DBIG_ENDIAN=4321" \
            -DCMAKE_PREFIX_PATH="$PREFIX;$PREFIX/share/eigen3/cmake" \
            -DCMAKE_FIND_ROOT_PATH="$PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DZLIB_INCLUDE_DIR=$PREFIX/include \
            -DZLIB_LIBRARY=$PREFIX/lib/libz.a \
            -Dzip_INCLUDE_DIR=$PREFIX/include \
            -Dzip_LIBRARY=$PREFIX/lib/libzip.a
          make -j$(nproc) katago 2>&1 | tail -200
          echo "--- Find katago binary ---"
          find $GITHUB_WORKSPACE/katago-src -name "katago" -type f 2>/dev/null || true
          find $GITHUB_WORKSPACE/katago-src -name "katago*" -type f 2>/dev/null | head -20 || true
          ls -la $GITHUB_WORKSPACE/katago-src/cpp/build-android-arm64/

      - name: Verify KataGo binary
        run: |
          mkdir -p katago-output
          KATAGO_BIN=$(find $GITHUB_WORKSPACE/katago-src -name "katago" -type f 2>/dev/null | head -1)
          echo "Found katago at: $KATAGO_BIN"
          if [ -z "$KATAGO_BIN" ]; then
            echo "ERROR: katago binary not found!"
            find $GITHUB_WORKSPACE/katago-src -type f -executable 2>/dev/null | head -20
            exit 1
          fi
          cp "$KATAGO_BIN" katago-output/katago
          chmod +x katago-output/katago
          file katago-output/katago
          ls -lh katago-output/

      - name: Upload KataGo binary
        uses: actions/upload-artifact@v4
        with:
          name: katago-android-arm64
          path: katago-output/katago

  download-model:
    name: Prepare KataGo Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create default config (model will be downloaded by user on first launch)
        run: |
          mkdir -p model-output
          cat > model-output/default_gtp.cfg << 'EOF'
          numSearchThreads = 4
          maxVisits = 200
          maxTime = 5.0
          analysisPVLen = 12
          EOF
          echo "Model file is not included - user will download on first launch"
          ls -lh model-output/

      - name: Upload config
        uses: actions/upload-artifact@v4
        with:
          name: katago-model-config
          path: model-output/

  build-apk:
    name: Build Android APK
    needs: [build-katago, download-model]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download KataGo binary
        uses: actions/download-artifact@v4
        with:
          name: katago-android-arm64
          path: assets/katago/

      - name: Download model and config
        uses: actions/download-artifact@v4
        with:
          name: katago-model-config
          path: assets/katago/

      - name: Prepare assets
        run: |
          chmod +x assets/katago/katago 2>/dev/null || true
          ls -lh assets/katago/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential libsqlite3-dev \
            wget curl automake openjdk-17-jdk
          sudo apt-get install -y libtinfo5 2>/dev/null || true
          which libtoolize || sudo apt-get install -y libtool-bin || true

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer python-for-android cython
          python -m pip list | grep -i "buildozer\|cython\|kivy\|python-for-android"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Setup Android SDK and accept licenses
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/intel-android-extra-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;33.0.1" "platforms;android-33" || true
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager || true
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager $ANDROID_HOME/tools/bin/avdmanager || true
          ls -la $ANDROID_HOME/
          ls -la $ANDROID_HOME/tools/bin/

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          yes | buildozer android debug 2>&1 | tee build.log
        env:
          ANDROIDSDK: $HOME/.buildozer/android/platform/android-sdk
          BUILDOZER_WARN_ON_ROOT: 1
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Find APK files
        id: find_apk
        run: |
          echo "APK files found:"
          ls -la bin/*.apk 2>/dev/null || echo "No APK found in bin/"
          find . -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(ls bin/*.apk 2>/dev/null | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          if [ -n "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
